name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle LibreHardwareMonitor (temperatures)
        shell: pwsh
        run: |
          $dest = "src-tauri/bin"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/LibreHardwareMonitor/LibreHardwareMonitor/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match '\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "LibreHardwareMonitor release zip not found" }
          $zip = "$env:RUNNER_TEMP/lhm.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          $extract = "$env:RUNNER_TEMP/lhm"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $exe = Get-ChildItem -Path $extract -Recurse -Filter "LibreHardwareMonitor.exe" | Select-Object -First 1
          if (-not $exe) { throw "LibreHardwareMonitor.exe not found in archive" }
          Copy-Item -Path "$($exe.Directory.FullName)\*" -Destination $dest -Recurse -Force
          $bundled = Get-ChildItem -Path $dest -Recurse -File
          if (-not (Test-Path "$dest/LibreHardwareMonitor.exe")) {
            throw "LibreHardwareMonitor.exe missing in $dest after bundle ($($bundled.Count) files)"
          }
          Write-Host "Bundled LHM from $($asset.name) into $dest ($($bundled.Count) files)"

      - name: Bundle PawnIO setup (CPU temperature driver)
        shell: pwsh
        run: |
          $dest = "src-tauri/bin"
          $pawnio = "$env:RUNNER_TEMP/PawnIO_setup.exe"
          Invoke-WebRequest -Uri "https://github.com/namazso/PawnIO.Setup/releases/download/2.2.0/PawnIO_setup.exe" -OutFile $pawnio
          Copy-Item -Path $pawnio -Destination "$dest/PawnIO_setup.exe" -Force
          Write-Host "Bundled PawnIO_setup.exe 2.2.0 into $dest"

      - name: Prepare signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          BUILD_ARGS="--target x86_64-pc-windows-msvc"
          if [ -n "$SIGNING_KEY" ]; then
            KEY_FILE="$RUNNER_TEMP/tauri-signing.key"
            printf '%s' "$SIGNING_KEY" > "$KEY_FILE"
            echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_FILE" >> "$GITHUB_ENV"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY no configurado; instalador sin firmas de updater"
            BUILD_ARGS="$BUILD_ARGS --config bundle.createUpdaterArtifacts=false"
          fi
          echo "BUILD_ARGS=$BUILD_ARGS" >> "$GITHUB_ENV"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: Sideglass ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for details.
          releaseDraft: false
          prerelease: false
          args: ${{ env.BUILD_ARGS }}

      - name: Upload stable Windows installer URL
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALLER_NAME: Sideglass_x64-setup.exe
        run: |
          $bundleDir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $setup = Get-ChildItem -Path $bundleDir -Filter "*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) {
            throw "NSIS setup.exe not found under $bundleDir"
          }
          $stable = Join-Path $PWD $env:INSTALLER_NAME
          Copy-Item -Path $setup.FullName -Destination $stable -Force
          Write-Host "Uploading stable asset $env:INSTALLER_NAME from $($setup.Name)"
          gh release upload ${{ github.ref_name }} "$stable" --clobber
